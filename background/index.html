<!DOCTYPE html>
<html>
  <head>
    <title>Background</title>
    <style>
      html, body {
	  margin: 0;
	  padding: 0;
	  
	  overflow: hidden;
      }

      .canvas {
	  width: 100vw;
	  height: 100vh;
	  
	  overflow: hidden;
      }
      
      .canvas > canvas {
	  width: 100%;
	  height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <canvas id="canvas"></canvas>
    </div>
    <script type="text/javascript" src="odin.js"></script>
    <script type="text/javascript">
      const mem = new WebAssembly.Memory({ initial: 2000, maximum: 65536, shared: false });
      const memInterface = new odin.WasmMemoryInterface();
      memInterface.setMemory(mem);
      odin.runWasm("bin/background.wasm", null, null, memInterface);
    </script>
  </body>
</html>
