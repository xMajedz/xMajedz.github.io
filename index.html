<!DOCTYPE html>
<html>
  <head>
    <style>
      html, body {
	  margin: 0;
	  padding: 0;
	  
	  overflow: hidden;
      }
      
      .background {   
	  overflow: hidden;
	  
	  width: 100vw;
	  height: 100vh;
      }

      .background > iframe {	  
	  border: 0;
	  
	  width: 100vw;
	  height: 100vh;
      }
    </style>
  </head>
  <body>
    <div class="background">
      <iframe src="/background"></iframe>
    </div>
  </body>
</html>
